name: Publish release

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up pnpm
        if: steps.existing.outputs.exists == 'false'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        if: steps.existing.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.existing.outputs.exists == 'false'
        run: pnpm install --frozen-lockfile

      - name: Type-check
        if: steps.existing.outputs.exists == 'false'
        run: pnpm compile

      - name: Build release packages
        if: steps.existing.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          pnpm zip
          pnpm zip:firefox
          mkdir release-assets
          cp ".output/chatgpt-backup-wxt-$VERSION-chrome.zip" "release-assets/chatgpt-backup-$VERSION-chrome.zip"
          cp ".output/chatgpt-backup-wxt-$VERSION-firefox.zip" "release-assets/chatgpt-backup-$VERSION-firefox.zip"
          cp ".output/chatgpt-backup-wxt-$VERSION-sources.zip" "release-assets/chatgpt-backup-$VERSION-sources.zip"

      - name: Generate package checksums
        if: steps.existing.outputs.exists == 'false'
        run: cd release-assets && sha256sum *.zip > SHA256SUMS.txt

      - name: Save release packages as workflow artifacts
        if: steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-backup-${{ steps.version.outputs.version }}
          path: release-assets/
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
