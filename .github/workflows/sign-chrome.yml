name: Package signed Chrome CRX

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        default: v0.1.5

permissions:
  contents: write

concurrency:
  group: sign-chrome-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Download and sign existing release package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHROME_CRX_PRIVATE_KEY: ${{ secrets.CHROME_CRX_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag such as v0.1.5' >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          PACKAGE="chatgpt-backup-$VERSION-chrome"
          mkdir -p release-assets "$RUNNER_TEMP/crx-package"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE.zip" --pattern SHA256SUMS.txt --dir release-assets
          (cd release-assets && sha256sum --check --ignore-missing SHA256SUMS.txt)
          unzip -q "release-assets/$PACKAGE.zip" -d "$RUNNER_TEMP/crx-package/extension"
          node -e 'const m=require(process.argv[1]); if(m.version!==process.argv[2]) process.exit(1)' \
            "$RUNNER_TEMP/crx-package/extension/manifest.json" "$VERSION"

          KEY_FILE="$RUNNER_TEMP/chrome-upload-key.pem"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$CHROME_CRX_PRIVATE_KEY" | base64 --decode > "$KEY_FILE"
          test -s "$KEY_FILE"
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome)"
          "$CHROME_BIN" --no-sandbox \
            --pack-extension="$RUNNER_TEMP/crx-package/extension" \
            --pack-extension-key="$KEY_FILE"
          test -s "$RUNNER_TEMP/crx-package/extension.crx"
          cp "$RUNNER_TEMP/crx-package/extension.crx" "release-assets/$PACKAGE.crx"
          (cd release-assets && sha256sum "$PACKAGE.crx" > "$PACKAGE.crx.sha256")

      - name: Attach signed CRX to GitHub release (no store submission)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          gh release upload "$TAG" release-assets/*.crx release-assets/*.crx.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber
